<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Solution X - Kartvizit</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --black: #111111;
        --white: #FFFFFF;
        --gray: #555555;
    }
    body {
        background-color: #f4f4f4;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
        padding: 40px;
        font-family: 'Montserrat', sans-serif;
    }
    .card-wrapper {
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        background: var(--white);
    }
    .card {
        position: relative;
        width: 84mm;
        height: 52mm;
        background: var(--white);
        overflow: hidden;
        box-sizing: border-box;
    }
    
    /* Yeni Kendi X'imiz (Arkaplan) */
    .bg-geometry {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
    }
    
    .content {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 8mm;
        box-sizing: border-box;
    }
    
    .left-side, .right-side {
        width: 35%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        z-index: 3;
    }
    
    .right-side {
        align-items: flex-start;
    }

    /* Ön Yüz Sol Kısım (İsim) */
    .name-box h1 {
        font-size: 11pt;
        font-weight: 700;
        color: var(--black);
        margin: 0 0 2px 0;
        letter-spacing: -0.5px;
    }
    .name-box p {
        font-size: 6pt;
        font-weight: 400;
        color: var(--gray);
        margin: 0 0 6px 0;
        letter-spacing: 0.5px;
    }
    .name-box .line {
        width: 68%; /* "Elif Aksüt" kelimelerinin hizasında bitmesi için ayarlandı */
        height: 0.5px;
        background-color: var(--black);
    }

    /* Ön Yüz Sağ Kısım (İletişim) */
    .contact-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .contact-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 5.5pt;
        color: var(--gray);
    }
    .contact-item svg {
        width: 8px;
        height: 8px;
        fill: var(--black);
    }

    /* Gerçek Logomuz */
    .logo {
        display: flex;
        align-items: center;
    }
    .logo-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 11pt;
        font-weight: 300;
        letter-spacing: 0.5px;
        color: #555555;
    }
    .hr-bold {
        font-weight: 700;
        color: #111111;
        letter-spacing: -0.5px;
        margin-right: 1px;
    }
    .logo-x {
        position: relative;
        width: 24px;
        height: 32px;
        display: inline-block;
        margin-left: -2px;
    }
    .logo-x::before, .logo-x::after {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        height: 100%;
        transform-origin: center;
    }
    .logo-x::before {
        width: 2.5px;
        background: linear-gradient(180deg, rgba(17,17,17,0.3) 0%, rgba(17,17,17,1) 20%, rgba(17,17,17,1) 80%, rgba(17,17,17,0.3) 100%);
        transform: translateX(-50%) rotate(38deg);
    }
    .logo-x::after {
        width: 0.6px;
        background: linear-gradient(180deg, rgba(17,17,17,0.3) 0%, rgba(17,17,17,1) 20%, rgba(17,17,17,1) 80%, rgba(17,17,17,0.3) 100%);
        transform: translateX(-50%) rotate(-38deg);
    }

    .website-back {
        font-size: 7pt;
        color: var(--gray);
        letter-spacing: 1px;
        text-align: right;
        width: 100%;
    }

    .label {
        font-size: 12px;
        color: #888;
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .back-content {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 3;
    }

    @media print {
        body { background: white; padding: 0; margin: 0; gap: 10mm; }
        .card-wrapper { box-shadow: none; border: 0.5px solid #eee; }
        .label { display: none; }
    }
</style>
</head>
<body>

    <!-- ÖN YÜZ -->
    <div>
        <div class="label">Ön Yüz (84 x 52 mm)</div>
        <div class="card-wrapper">
            <div class="card">
                <!-- Arkaplan X (Bizim asimetrik, eriyen X'imiz) -->
                <div class="bg-geometry">
                    <svg viewBox="0 0 840 520" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
                        <defs>
                            <linearGradient id="xGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#111" stop-opacity="0.05" />
                                <stop offset="20%" stop-color="#111" stop-opacity="1" />
                                <stop offset="80%" stop-color="#111" stop-opacity="1" />
                                <stop offset="100%" stop-color="#111" stop-opacity="0.05" />
                            </linearGradient>
                        </defs>
                        <!-- Kendi logomuzun devasa hali -->
                        <g transform="translate(420, 260)">
                            <!-- Kalın Kol -->
                            <rect x="-10" y="-300" width="20" height="600" fill="url(#xGrad)" transform="rotate(38)" />
                            <!-- İnce Kol -->
                            <rect x="-2" y="-300" width="4" height="600" fill="url(#xGrad)" transform="rotate(-38)" />
                        </g>
                    </svg>
                </div>
                
                <div class="content">
                    <div class="left-side">
                        <div class="name-box">
                            <h1>Elif Aksüt ELGİN</h1>
                            <p>Kurucu & CEO</p>
                            <div class="line"></div>
                        </div>
                    </div>
                    <div class="right-side" style="padding-left: 10mm;">
                        <div class="contact-info">
                            <div class="contact-item">
                                <!-- Phone Icon -->
                                <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                                +90 5XX XXX XX XX
                            </div>
                            <div class="contact-item">
                                <!-- Email Icon -->
                                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                                elif@hrsolutionx.com
                            </div>
                            
                            <div class="contact-item">
                                <!-- Web Icon -->
                                <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2 0-.68.07-1.35.16-2h4.68c.09.65.16 1.32.16 2 0 .68-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
                                www.hrsolutionx.com
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ARKA YÜZ -->
    <div>
        <div class="label">Arka Yüz (84 x 52 mm)</div>
        <div class="card-wrapper">
            <div class="card">
                <!-- Arka Yüzde Sadece Bizim Orijinal Logomuz Tam Merkezde -->
                <div class="back-content">
                    <div class="logo">
                        <span class="logo-text"><span class="hr-bold">HR</span> SOLUTION</span>
                        <span class="logo-x"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
